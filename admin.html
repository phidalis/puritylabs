<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purity Labs Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===== LOGIN GATE ===== -->
  <div class="login-gate" id="loginGate">
    <div class="login-card">
      <div class="login-brand"><span class="lb-text">Purity<span>Labs</span></span><small>Admin Panel</small></div>
      <h1 class="login-title">Sign in to Admin</h1>
      <p class="login-sub">Manage products, orders, content and more.</p>
      <form id="loginForm">
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="loginUser" autocomplete="email" placeholder="admin@puritylabs.com" required>
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="loginPass" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="loginError"></p>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-hint">Sign in with your Firebase admin account.</p>
    </div>
  </div>

  <!-- ===== ADMIN SHELL ===== -->
  <div class="admin-wrap" id="adminWrap">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <span class="lb-text">Purity<span>Labs</span></span>
        <span class="side-brand-sub">Control Center</span>
      </div>
      <div class="side-profile">
        <div class="avatar" id="adminAvatar">A</div>
        <div class="side-profile-meta">
          <b id="adminName">Admin</b>
          <span>Administrator</span>
        </div>
      </div>
      <nav class="side-nav" id="sideNav">
        <!-- rendered by JS -->
      </nav>
      <div class="side-footer">
        <a href="index.html" target="_blank" class="side-link"><i class="fa-solid fa-up-right-from-square"></i> View Website</a>
        <button class="side-link" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <span id="breadcrumb">Admin / Overview</span>
        </div>
        <div class="topbar-actions">
          <div class="global-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="globalSearch" placeholder="Quick search products & orders...">
          </div>
          <button class="icon-btn" id="notifBtn" title="Notifications"><i class="fa-solid fa-bell"></i><span class="notif-dot" id="notifDot"></span></button>
          <button class="btn btn-ghost" id="syncBtn" title="Write the product catalog (products, categories, nav, content, settings) to Firestore. Transactions are never touched."><i class="fa-solid fa-cloud-arrow-up"></i> Publish Catalog</button>
          <button class="btn btn-primary" id="quickAddBtn"><i class="fa-solid fa-plus"></i> Add Product</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- PANELS are rendered into panels/… (static sections below get populated) -->
        <section class="panel" id="panel-dashboard"></section>
        <section class="panel" id="panel-products"></section>
        <section class="panel" id="panel-categories"></section>
        <section class="panel" id="panel-orders"></section>
        <section class="panel" id="panel-customers"></section>
        <section class="panel" id="panel-coupons"></section>
        <section class="panel" id="panel-promotions"></section>
        <section class="panel" id="panel-reviews"></section>
        <section class="panel" id="panel-content"></section>
        <section class="panel" id="panel-navigation"></section>
        <section class="panel" id="panel-media"></section>
        <section class="panel" id="panel-analytics"></section>
        <section class="panel" id="panel-settings"></section>
      </div>
    </main>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox">
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- ===== TOASTS ===== -->
  <div class="toasts" id="toasts"></div>

  <!-- ===== CONFIRM ===== -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal modal-sm">
      <div class="modal-body">
        <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3 id="confirmTitle">Are you sure?</h3>
        <p id="confirmText"></p>
      </div>
      <div class="modal-foot right">
        <button class="btn btn-ghost" id="confirmNo">Cancel</button>
        <button class="btn btn-danger" id="confirmYes">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="pdb.js"></script>
  <script src="catalog.js"></script>
  <script src="admin.js"></script>
</body>
</html>
