# ===== Render blueprint =====
# Deploy: Render > New > Blueprint, point at this repo.
# Or: create a new Web Service manually (Node, build: npm install, start: npm start).
services:
  - type: web
    name: purity-labs
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Fill these in the Render dashboard (env group) after deploy.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Replace with the actual URL assigned to this service.
      - key: PUBLIC_URL
        value: https://your-app.onrender.com